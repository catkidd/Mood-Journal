<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Forbidden — MoodJournal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="text-center">
        <div style="font-size:5rem;">🔒</div>
        <h1 class="display-4 fw-bold mt-3" style="color:#5B8FBF;">403</h1>
        <h2 class="fw-semibold mb-3">Access Denied</h2>
        <p class="text-muted mb-4">You don't have permission to view this page.</p>
        <a th:href="@{/dashboard}" class="btn btn-mood-primary">
            <i class="bi bi-house-door-fill me-2"></i>Return to Dashboard
        </a>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
