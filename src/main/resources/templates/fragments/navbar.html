<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg mood-navbar shadow-sm">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/dashboard}">
            <span class="brand-emoji">🌿</span>
            <span class="brand-name">MoodJournal</span>
        </a>
        <button class="navbar-toggler border-0" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-1" sec:authorize="isAuthenticated()">
                <li class="nav-item">
                    <a class="nav-link nav-link-custom" th:href="@{/dashboard}">
                        <i class="bi bi-house-door-fill me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-link-custom" th:href="@{/entries/new}">
                        <i class="bi bi-plus-circle-fill me-1"></i>Add Entry
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-link-custom" th:href="@{/entries}">
                        <i class="bi bi-journal-text me-1"></i>Entries
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-link-custom" th:href="@{/summary}">
                        <i class="bi bi-bar-chart-fill me-1"></i>Summary
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-link-custom" th:href="@{/badges}">
                        <i class="bi bi-award-fill me-1"></i>Badges
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-link-custom" th:href="@{/export}">
                        <i class="bi bi-download me-1"></i>Export
                    </a>
                </li>
                <li class="nav-item ms-lg-2 d-flex align-items-center gap-2">
                    <span class="navbar-username d-none d-lg-inline-flex align-items-center gap-1"
                          style="font-size:0.85rem; opacity:0.8; font-weight:500;">
                        <i class="bi bi-person-circle"></i>
                        <span sec:authentication="name">User</span>
                    </span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-logout">
                            <i class="bi bi-box-arrow-right me-1"></i>Logout
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
