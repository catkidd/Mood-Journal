<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${formMode == 'edit' ? 'Edit Entry' : 'New Entry'} + ' — MoodJournal'">Entry — MoodJournal</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <meta name="description" content="Add or edit your mood journal entry.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="flex-grow-1 py-4">
    <div class="container" style="max-width:680px;">

        <!-- Header -->
        <div class="page-header mb-4">
            <h1 th:if="${formMode == 'edit'}"><i class="bi bi-pencil-square me-2"></i>Edit Entry</h1>
            <h1 th:unless="${formMode == 'edit'}"><i class="bi bi-plus-circle me-2"></i>New Journal Entry</h1>
            <p class="text-muted mb-0">Capture how you feel — every entry matters.</p>
        </div>

        <!-- Form Card -->
        <div class="mood-form-card p-4">
            <form th:action="${formMode == 'edit' ? '/entries/' + entry.id + '/edit' : '/entries/new'}"
                  th:object="${entry}" method="post" id="entryForm" novalidate>

                <!-- Date -->
                <div class="mb-3">
                    <label for="entryDate" class="form-label">
                        <i class="bi bi-calendar3 me-1"></i>Date <span class="text-danger">*</span>
                    </label>
                    <input type="date" id="entryDate" th:field="*{date}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('date')} ? ' is-invalid'"
                           required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('date')}"
                         th:errors="*{date}"></div>
                </div>

                <!-- Mood Selector -->
                <div class="mb-3">
                    <label class="form-label d-block">
                        <i class="bi bi-emoji-smile me-1"></i>How are you feeling? <span class="text-danger">*</span>
                    </label>
                    <!-- Visual mood picker -->
                    <div class="mood-picker d-flex flex-wrap gap-2 mb-2">
                        <label th:each="m : ${moods}"
                               class="mood-option"
                               th:for="${'mood_' + m}">
                            <input type="radio" th:id="${'mood_' + m}" th:field="*{mood}"
                                   th:value="${m}" class="mood-radio">
                            <span class="mood-option-label"
                                  th:attr="data-mood=${m}"
                                  th:classappend="${'mood-' + m}">
                                <span th:switch="${m}">
                                    <span th:case="'HAPPY'">😊</span>
                                    <span th:case="'SAD'">😢</span>
                                    <span th:case="'STRESSED'">😰</span>
                                    <span th:case="'CALM'">😌</span>
                                    <span th:case="'ANGRY'">😠</span>
                                    <span th:case="'ANXIOUS'">😟</span>
                                    <span th:case="'EXCITED'">🤩</span>
                                    <span th:case="'GRATEFUL'">🙏</span>
                                </span>
                                <span th:text="${m}" class="mood-label-text"></span>
                            </span>
                        </label>
                    </div>
                    <div th:if="${#fields.hasErrors('mood')}" class="text-danger small"
                         th:errors="*{mood}"></div>
                </div>

                <!-- Journal Text -->
                <div class="mb-3">
                    <label for="entryText" class="form-label">
                        <i class="bi bi-pencil me-1"></i>Journal Notes
                        <span class="text-muted fw-normal">(optional)</span>
                    </label>
                    <textarea id="entryText" th:field="*{text}"
                              class="form-control" rows="5"
                              placeholder="What's on your mind? How was your day? Write freely..."></textarea>
                    <div class="form-text text-end">
                        <span id="charCount">0</span> characters
                    </div>
                </div>

                <!-- Tags -->
                <div class="mb-4">
                    <label for="entryTags" class="form-label">
                        <i class="bi bi-tags me-1"></i>Tags
                        <span class="text-muted fw-normal">(optional)</span>
                    </label>
                    <input type="text" id="entryTags" th:field="*{tags}"
                           class="form-control"
                           placeholder="e.g. work, exercise, family (comma-separated)">
                    <div class="form-text">Separate multiple tags with commas.</div>
                </div>

                <!-- Actions -->
                <div class="d-flex gap-3">
                    <button type="submit" class="btn btn-mood-primary flex-grow-1">
                        <i th:class="${formMode == 'edit' ? 'bi bi-check2-circle' : 'bi bi-save'}" class="me-2"></i>
                        <span th:text="${formMode == 'edit' ? 'Update Entry' : 'Save Entry'}"></span>
                    </button>
                    <a th:href="@{/entries}" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-x-lg me-1"></i>Cancel
                    </a>
                </div>

            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Character counter
    const textArea = document.getElementById('entryText');
    const charCount = document.getElementById('charCount');
    function updateCount() {
        charCount.textContent = textArea.value.length;
    }
    textArea.addEventListener('input', updateCount);
    updateCount();
</script>
</body>
</html>
