<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MoodJournal</title>
    <meta name="description" content="Choose a new password for your MoodJournal account.">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body">
<div class="auth-container">
    <div class="auth-card fade-in-up">

        <!-- Brand -->
        <div class="auth-brand">
            <span class="brand-icon">🌿</span>
            <div class="brand-title">MoodJournal</div>
            <p class="text-muted mt-1" style="font-size:0.9rem;">Choose a new password</p>
        </div>

        <!-- Token error state (expired / already used / not found) -->
        <div th:if="${tokenError}" class="text-center py-3">
            <div class="mb-3" style="font-size:3rem;">⚠️</div>
            <h5 class="fw-semibold mb-2">Link Invalid or Expired</h5>
            <p class="text-muted mb-4" style="font-size:0.92rem;" th:text="${tokenError}"></p>
            <a th:href="@{/forgot-password}" class="btn btn-mood-primary">
                <i class="bi bi-arrow-repeat me-2"></i>Request New Link
            </a>
        </div>

        <!-- Reset Password Form (shown only when token is valid) -->
        <div th:if="${token}">

            <!-- Error message (e.g., passwords don't match) -->
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <form th:action="@{/reset-password}" method="post" id="resetForm">
                <!-- Hidden token — not visible in the URL after POST -->
                <input type="hidden" name="token" th:value="${token}">

                <div class="mb-3">
                    <label for="password" class="form-label">
                        <i class="bi bi-lock me-1"></i>New Password
                    </label>
                    <div class="input-group">
                        <input type="password" id="password" name="password"
                               class="form-control form-control-lg"
                               placeholder="At least 8 characters"
                               autocomplete="new-password" required minlength="8" autofocus>
                        <button class="btn btn-outline-secondary" type="button"
                                onclick="togglePwd('password','eye1')">
                            <i class="bi bi-eye" id="eye1"></i>
                        </button>
                    </div>
                    <!-- Strength bar -->
                    <div class="progress mt-2" style="height:4px;border-radius:2px;">
                        <div id="strengthBar" class="progress-bar" style="width:0%;transition:width 0.3s,background 0.3s;"></div>
                    </div>
                    <small id="strengthLabel" class="text-muted" style="font-size:0.78rem;"></small>
                </div>

                <div class="mb-4">
                    <label for="confirmPassword" class="form-label">
                        <i class="bi bi-lock-fill me-1"></i>Confirm New Password
                    </label>
                    <div class="input-group">
                        <input type="password" id="confirmPassword" name="confirmPassword"
                               class="form-control form-control-lg"
                               placeholder="Repeat your new password"
                               autocomplete="new-password" required minlength="8">
                        <button class="btn btn-outline-secondary" type="button"
                                onclick="togglePwd('confirmPassword','eye2')">
                            <i class="bi bi-eye" id="eye2"></i>
                        </button>
                    </div>
                    <div id="matchFeedback" class="mt-1" style="font-size:0.8rem;"></div>
                </div>

                <button type="submit" class="btn btn-mood-primary w-100 btn-lg mb-3" id="submitBtn">
                    <i class="bi bi-shield-check me-2"></i>Set New Password
                </button>
            </form>
        </div>

        <div class="text-center">
            <a th:href="@{/login}" class="fw-semibold auth-link" style="font-size:0.9rem;">
                <i class="bi bi-arrow-left me-1"></i>Back to Sign In
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function togglePwd(fieldId, iconId) {
        const input = document.getElementById(fieldId);
        const icon  = document.getElementById(iconId);
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'bi bi-eye';
        }
    }

    // Password strength meter
    const pwdInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirmPassword');

    if (pwdInput) {
        pwdInput.addEventListener('input', function () {
            const val = pwdInput.value;
            let score = 0;
            if (val.length >= 8)  score++;
            if (val.length >= 12) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            const bar   = document.getElementById('strengthBar');
            const label = document.getElementById('strengthLabel');
            const pct   = (score / 5) * 100;
            bar.style.width = pct + '%';

            if (score <= 1) { bar.style.background = '#dc3545'; label.textContent = 'Weak'; }
            else if (score <= 3) { bar.style.background = '#ffc107'; label.textContent = 'Fair'; }
            else { bar.style.background = '#2d6a4f'; label.textContent = 'Strong'; }
        });

        confirmInput.addEventListener('input', function () {
            const feedback = document.getElementById('matchFeedback');
            if (confirmInput.value === '') {
                feedback.textContent = '';
            } else if (confirmInput.value === pwdInput.value) {
                feedback.innerHTML = '<span style="color:#2d6a4f;"><i class="bi bi-check-circle-fill me-1"></i>Passwords match</span>';
            } else {
                feedback.innerHTML = '<span style="color:#dc3545;"><i class="bi bi-x-circle-fill me-1"></i>Passwords do not match</span>';
            }
        });
    }

    // Prevent double-submit
    const form = document.getElementById('resetForm');
    if (form) {
        form.addEventListener('submit', function () {
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span>Saving…';
        });
    }
</script>
</body>
</html>
