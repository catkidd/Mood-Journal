<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MoodJournal</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <meta name="description" content="Create your free MoodJournal account to start tracking your daily mood.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body">
<div class="auth-container">
    <div class="auth-card fade-in-up">
        <!-- Brand -->
        <div class="auth-brand">
            <span class="brand-icon">🌿</span>
            <div class="brand-title">Join MoodJournal</div>
            <p class="text-muted mt-1" style="font-size:0.9rem;">Create your free account today</p>
        </div>

        <!-- Registration Form -->
        <form th:action="@{/register}" th:object="${registrationForm}" method="post" id="registerForm"
              novalidate>

            <!-- Username -->
            <div class="mb-3">
                <label for="username" class="form-label">
                    <i class="bi bi-person me-1"></i>Username
                </label>
                <input type="text" id="username" th:field="*{username}"
                       class="form-control form-control-lg"
                       th:classappend="${#fields.hasErrors('username')} ? ' is-invalid'"
                       placeholder="Choose a username (3–50 chars)" autocomplete="username" autofocus>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}"
                     th:errors="*{username}"></div>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="password" class="form-label">
                    <i class="bi bi-lock me-1"></i>Password
                </label>
                <div class="input-group">
                    <input type="password" id="password" th:field="*{password}"
                           class="form-control form-control-lg"
                           th:classappend="${#fields.hasErrors('password')} ? ' is-invalid'"
                           placeholder="At least 6 characters" autocomplete="new-password">
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePwd('password','eye1')">
                        <i class="bi bi-eye" id="eye1"></i>
                    </button>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                         th:errors="*{password}"></div>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-4">
                <label for="confirmPassword" class="form-label">
                    <i class="bi bi-lock-fill me-1"></i>Confirm Password
                </label>
                <div class="input-group">
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                           class="form-control form-control-lg"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? ' is-invalid'"
                           placeholder="Repeat your password" autocomplete="new-password">
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePwd('confirmPassword','eye2')">
                        <i class="bi bi-eye" id="eye2"></i>
                    </button>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}"
                         th:errors="*{confirmPassword}"></div>
                </div>
            </div>

            <button type="submit" class="btn btn-mood-primary w-100 btn-lg mb-3">
                <i class="bi bi-person-plus-fill me-2"></i>Create Account
            </button>
        </form>

        <div class="text-center">
            <span class="text-muted" style="font-size:0.9rem;">Already have an account?</span>
            <a th:href="@{/login}" class="ms-1 fw-semibold auth-link">Sign in</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function togglePwd(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon  = document.getElementById(iconId);
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'bi bi-eye';
        }
    }
</script>
</body>
</html>
