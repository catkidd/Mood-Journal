<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MoodJournal</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <meta name="description" content="Sign in to MoodJournal to track your daily mood and emotions.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body">
<div class="auth-container">
    <div class="auth-card fade-in-up">
        <!-- Brand -->
        <div class="auth-brand">
            <span class="brand-icon">🌿</span>
            <div class="brand-title">MoodJournal</div>
            <p class="text-muted mt-1" style="font-size:0.9rem;">Track your emotions, grow your mind</p>
        </div>

        <!-- Alerts -->
        <div th:if="${param.logout}" class="alert alert-success alert-dismissible" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>You have been logged out successfully.
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${param.error}" class="alert alert-danger alert-dismissible" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>Invalid username or password. Please try again.
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post" id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">
                    <i class="bi bi-person me-1"></i>Username
                </label>
                <input type="text" id="username" name="username" class="form-control form-control-lg"
                       placeholder="Enter your username" autocomplete="username" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">
                    <i class="bi bi-lock me-1"></i>Password
                </label>
                <div class="input-group">
                    <input type="password" id="password" name="password" class="form-control form-control-lg"
                           placeholder="Enter your password" autocomplete="current-password" required>
                    <button class="btn btn-outline-secondary" type="button" id="togglePassword"
                            onclick="togglePwd()">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-mood-primary w-100 btn-lg mb-3">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
            <div class="text-center mb-1">
                <a th:href="@{/forgot-password}" class="auth-link" style="font-size:0.88rem;">
                    <i class="bi bi-question-circle me-1"></i>Forgot your password?
                </a>
            </div>
        </form>

        <div class="text-center">
            <span class="text-muted" style="font-size:0.9rem;">Don't have an account?</span>
            <a th:href="@{/register}" class="ms-1 fw-semibold auth-link">Create one free</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function togglePwd() {
        const input = document.getElementById('password');
        const icon  = document.getElementById('eyeIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'bi bi-eye';
        }
    }
</script>
</body>
</html>
