<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - MoodJournal</title>
    <meta name="description" content="Reset your MoodJournal password via email.">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body">
<div class="auth-container">
    <div class="auth-card fade-in-up">

        <!-- Brand -->
        <div class="auth-brand">
            <span class="brand-icon">🌿</span>
            <div class="brand-title">MoodJournal</div>
            <p class="text-muted mt-1" style="font-size:0.9rem;">Reset your password</p>
        </div>

        <!-- Flash Messages -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Instruction text -->
        <p class="text-muted mb-4" style="font-size:0.92rem;line-height:1.6;">
            Enter the email address linked to your account and we'll send you a secure link
            to reset your password.
        </p>

        <!-- Forgot Password Form -->
        <form th:action="@{/forgot-password}" method="post" id="forgotPasswordForm">
            <div class="mb-4">
                <label for="email" class="form-label">
                    <i class="bi bi-envelope me-1"></i>Email Address
                </label>
                <input type="email" id="email" name="email" class="form-control form-control-lg"
                       placeholder="you@example.com" autocomplete="email" required autofocus>
            </div>
            <button type="submit" class="btn btn-mood-primary w-100 btn-lg mb-3" id="submitBtn">
                <i class="bi bi-send me-2"></i>Send Reset Link
            </button>
        </form>

        <div class="text-center">
            <a th:href="@{/login}" class="fw-semibold auth-link" style="font-size:0.9rem;">
                <i class="bi bi-arrow-left me-1"></i>Back to Sign In
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Prevent double-submit
    document.getElementById('forgotPasswordForm').addEventListener('submit', function () {
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span>Sending…';
    });
</script>
</body>
</html>
