<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badges - MoodJournal</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <meta name="description" content="View all your earned mood journal achievement badges.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="flex-grow-1 py-4">
    <div class="container">

        <!-- Header -->
        <div class="page-header mb-2">
            <h1><i class="bi bi-award-fill me-2"></i>Achievement Badges</h1>
            <p class="text-muted mb-0">Keep journaling to unlock more badges!</p>
        </div>

        <!-- Progress Banner -->
        <div class="badge-progress-banner mb-4">
            <div class="d-flex align-items-center justify-content-between gap-3 flex-wrap">
                <div>
                    <span class="fw-semibold" style="font-size:1.05rem;">
                        You've earned
                        <span class="text-gradient fw-bold" th:text="${earnedCount}">0</span>
                        of
                        <span th:text="${totalCount}">5</span>
                        badges
                    </span>
                </div>
                <div class="flex-grow-1" style="max-width:300px;">
                    <div class="progress badge-progress-bar" style="height:10px;">
                        <div class="progress-bar" role="progressbar"
                             th:style="${'width: ' + (totalCount > 0 ? (earnedCount * 100 / totalCount) : 0) + '%'}">
                        </div>
                    </div>
                </div>
                <span class="text-muted" style="font-size:0.875rem;"
                      th:text="${totalCount - earnedCount} + ' more to go'"></span>
            </div>
        </div>

        <!-- Badges Grid -->
        <div class="row g-4">
            <div th:each="badge : ${allBadges}" class="col-6 col-md-4 col-lg-3">
                <div class="badge-card"
                     th:classappend="${earnedBadgeIds.contains(badge.id)} ? ' earned' : ' not-earned'">

                    <!-- Badge Icon -->
                    <div class="badge-icon-large" th:text="${badge.name.substring(0,2)}">🌱</div>

                    <!-- Badge Name -->
                    <h3 class="badge-name mt-3 mb-1"
                        th:text="${badge.name.substring(2).trim()}">Badge Name</h3>

                    <!-- Description -->
                    <p class="badge-desc text-muted mb-3"
                       th:text="${badge.description}">Description</p>

                    <!-- Status -->
                    <div th:if="${earnedBadgeIds.contains(badge.id)}">
                        <!-- Find the award date for this badge -->
                        <div th:each="ub : ${earnedBadges}"
                             th:if="${ub.badge.id == badge.id}">
                            <span class="badge-status earned-badge">
                                <i class="bi bi-check-circle-fill me-1"></i>Earned
                            </span>
                            <div class="badge-date mt-1"
                                 th:text="${#temporals.format(ub.dateAwarded, 'MMM d, yyyy')}"></div>
                        </div>
                    </div>
                    <div th:unless="${earnedBadgeIds.contains(badge.id)}">
                        <span class="badge-status locked-badge">
                            <i class="bi bi-lock-fill me-1"></i>Locked
                        </span>
                        <div class="badge-criteria mt-1 text-muted"
                             th:text="${badge.criteria == 'FIRST_ENTRY' ? 'Log your first entry' :
                                        badge.criteria == 'STREAK_7'   ? '7-day streak' :
                                        badge.criteria == 'ENTRIES_10' ? 'Log 10 entries' :
                                        badge.criteria == 'ENTRIES_30' ? 'Log 30 entries' :
                                        badge.criteria == 'ALL_MOODS'  ? 'Use 5 mood types' : ''}">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Motivational Message -->
        <div th:if="${earnedCount == totalCount}" class="text-center mt-5">
            <div style="font-size:3rem;">🎉</div>
            <h2 class="mt-2 fw-bold">Congratulations! All badges unlocked!</h2>
            <p class="text-muted">You're a MoodJournal champion. Keep the streak going!</p>
        </div>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
