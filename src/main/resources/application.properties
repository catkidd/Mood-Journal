# ===== Server =====
server.port=${PORT:8080}

# ===== DataSource (MySQL) =====
# Can be overridden via environment variables: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/moodjournal?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ===== Thymeleaf =====
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ===== Spring MVC =====
spring.mvc.format.date=yyyy-MM-dd

# ===== Logging =====
logging.level.com.moodjournal=DEBUG
logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.security=WARN

# ===== Email / SMTP =====
# Set MAIL_USERNAME and MAIL_PASSWORD as environment variables — NEVER hard-code credentials!
# Gmail example: generate an App Password at https://myaccount.google.com/apppasswords
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Enable raw SMTP conversation in logs (set to false in production)
spring.mail.properties.mail.debug=true

# ===== App =====
# Used to build the absolute reset link sent in emails
app.base-url=${APP_BASE_URL:http://localhost:8080}
